<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LaserWorks" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>LaserWorks</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body class="h-screen w-screen overflow-hidden text-gray-800">

  <div class="flex h-screen w-screen overflow-hidden bg-white">

    <!-- SIDEBAR (menu dibuat otomatis dari js/routes.js) -->
    <aside id="sidebar" class="flex shrink-0 flex-col justify-between items-center bg-white py-3.5">

      <nav class="menu-nav-container">
        <div class="relative flex h-9 w-full items-center">
          <button id="btn-sidebar-toggle"
            class="menu-btn text-gray-900 hover:text-blue-600 transition-colors duration-150"
            title="Buka / Tutup Sidebar" aria-label="Buka atau tutup sidebar" aria-expanded="false">
            <i data-lucide="panel-left" class="menu-icon slide-open-icon h-5 w-5"></i>
          </button>

          <button id="btn-extra-app-launcher"
            class="close-side-btn absolute right-1.5 p-1.5 text-gray-900 hover:text-blue-600 transition-colors duration-150"
            title="Tutup Menu" aria-label="Tutup menu samping">
            <i data-lucide="panel-left-close" class="h-5 w-5"></i>
          </button>
        </div>

        <div id="sidebar-nav-items" class="contents"></div>
      </nav>

      <div class="w-full px-2 pl-3">
        <div class="flex items-center gap-2 p-1.5 rounded-lg bg-gray-50 border border-gray-100">
          <span id="db-status-dot" class="h-2 w-2 rounded-full bg-emerald-500 shrink-0 ml-1"></span>
          <span id="db-status-text" class="menu-label text-[11px] text-gray-500 font-medium truncate">IndexedDB Ready</span>
        </div>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <div id="main-area" class="flex flex-1 flex-col h-screen overflow-hidden bg-white">

      <!-- HEADER (putih) -->
      <header class="flex h-12 shrink-0 items-center justify-between bg-white px-4 gap-2 sm:gap-3">

        <div class="flex items-center gap-2 text-xs min-w-0 flex-1">
          <div class="flex items-center gap-1.5 font-semibold text-gray-800 shrink-0">
            <span class="text-gray-900">LaserWorks</span>
            <span class="text-gray-300">/</span>
            <button id="header-page-title-btn" class="font-normal text-gray-600 hover:text-blue-600 transition-colors focus:outline-none">Home</button>
          </div>

          <div id="header-active-meta" class="hidden items-center gap-2 overflow-x-auto custom-scrollbar whitespace-nowrap text-xs font-normal text-gray-500 py-0.5">
            <span class="text-gray-300">/</span>
            <span id="header-card-title" class="font-bold text-gray-900">Nama Item</span>
            <span class="text-gray-300">•</span>
            <span id="header-meta-qty" class="text-gray-600 font-semibold">0 pcs</span>
            <span class="text-gray-300">•</span>
            <span id="header-meta-deadline" class="text-amber-700 font-semibold">-</span>
            <span class="text-gray-300">•</span>
            <span id="header-meta-subtask" class="text-emerald-700 font-semibold">0/0 Selesai</span>
            <span class="text-gray-300">•</span>
            <span id="header-meta-process" class="text-rose-700 font-semibold">Ditulis</span>
            <span class="text-gray-300">•</span>
            <span id="header-meta-attachment" class="text-sky-700 font-semibold">0 File</span>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">

          <div class="relative flex items-center">
            <button id="btn-header-search-toggle" type="button" class="flex h-8 w-8 items-center justify-center rounded-lg text-gray-500 hover:text-blue-600 hover:bg-gray-100 transition" title="Cari Pekerjaan (Nama, Jumlah, Deadline)">
              <i data-lucide="search" class="h-4 w-4"></i>
            </button>

            <div id="header-search-bar" class="hidden items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1 text-xs transition-all w-44 sm:w-72 md:w-80 shadow-2xs">
              <i data-lucide="search" class="h-3.5 w-3.5 text-gray-400 shrink-0"></i>
              <input type="text" id="header-search-input" placeholder="Cari nama, jumlah (17 pcs), deadline (17 Okt)..." class="w-full bg-transparent border-none outline-none focus:outline-none focus:ring-0 p-0 text-xs text-gray-800 placeholder-gray-400" autocomplete="off" />
              <button type="button" id="btn-clear-search" class="hidden text-gray-400 hover:text-gray-600 p-0.5 rounded transition" title="Hapus teks pencarian">
                <i data-lucide="x" class="h-3 w-3"></i>
              </button>
              <button type="button" id="btn-close-search" class="text-gray-400 hover:text-gray-600 p-0.5 rounded transition" title="Tutup pencarian">
                <i data-lucide="x" class="h-3.5 w-3.5"></i>
              </button>
            </div>
          </div>

          <a href="#/notifications" class="relative rounded-lg p-1.5 text-gray-500 hover:bg-gray-50 transition" title="Notifications">
            <i data-lucide="bell" class="h-4 w-4"></i>
            <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-red-500"></span>
          </a>

          <div class="flex items-center gap-1.5 pl-2 border-l border-gray-100">
            <div class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-50 text-[11px] font-semibold text-blue-600">LW</div>
            <span class="hidden text-xs font-medium sm:block text-gray-700">Admin</span>
          </div>

        </div>
      </header>

      <!-- OUTLET HALAMAN: isi diganti oleh router (lihat pages/*.html) -->
      <main id="view" class="flex-1 flex flex-col overflow-hidden p-3 md:p-4 min-h-0"></main>

    </div>
  </div>

  <!-- PREVIEW GAMBAR GLOBAL (zoom & pan) -->
  <div id="modal-image-preview" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-200 p-2 sm:p-4">

    <div id="image-preview-modal-box" class="w-[95vw] md:w-[60vw] h-[90vh] max-h-[90vh] rounded-2xl bg-white shadow-2xl border border-gray-100 overflow-hidden flex flex-col scale-95 transition-transform duration-200">

      <div class="flex h-12 shrink-0 items-center justify-between border-b border-gray-100 px-4 bg-white select-none">

        <div class="flex items-center gap-2.5 min-w-0 pr-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-50 text-blue-600 shrink-0">
            <i data-lucide="image" class="h-4 w-4"></i>
          </div>
          <div class="flex flex-col min-w-0">
            <h3 id="image-preview-title" class="text-xs font-bold text-gray-900 truncate">Preview Gambar</h3>
            <p id="image-preview-info" class="text-[10px] text-gray-400 truncate">Gunakan scroll mouse untuk Zoom dan drag untuk Pan</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200/80 rounded-lg p-1">
          <button type="button" id="btn-zoom-out" class="p-1 rounded text-gray-600 hover:text-gray-900 hover:bg-gray-200 transition" title="Zoom Out (-)">
            <i data-lucide="zoom-out" class="h-4 w-4"></i>
          </button>
          <span id="zoom-level-text" class="text-[11px] font-bold text-gray-700 min-w-[42px] text-center select-none">100%</span>
          <button type="button" id="btn-zoom-in" class="p-1 rounded text-gray-600 hover:text-gray-900 hover:bg-gray-200 transition" title="Zoom In (+)">
            <i data-lucide="zoom-in" class="h-4 w-4"></i>
          </button>
          <div class="h-4 w-[1px] bg-gray-200 mx-0.5"></div>
          <button type="button" id="btn-zoom-reset" class="px-2 py-0.5 rounded text-[10px] font-bold text-gray-600 hover:text-gray-900 hover:bg-gray-200 transition" title="Reset Zoom (1:1)">1:1</button>
          <button type="button" id="btn-zoom-fit" class="px-2 py-0.5 rounded text-[10px] font-bold text-blue-600 hover:bg-blue-50 transition" title="Sesuaikan Layar (Fit)">Fit</button>
        </div>

        <div class="flex items-center gap-1 pl-2">
          <button type="button" id="btn-close-image-preview" class="flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition" title="Tutup Preview (Esc)">
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </div>

      </div>

      <div id="image-preview-viewport" class="relative flex-1 w-full h-full overflow-hidden bg-white flex items-center justify-center select-none cursor-grab active:cursor-grabbing">
        <div id="image-preview-stage" class="absolute flex items-center justify-center origin-center transition-transform duration-75 ease-out">
          <img id="image-preview-img" src="" alt="Preview Gambar" class="max-w-none pointer-events-none select-none rounded shadow-md border border-gray-100" />
        </div>

        <div class="absolute bottom-3 left-4 bg-white/90 border border-gray-200 px-2.5 py-1 rounded-md text-[10px] text-gray-500 shadow-2xs pointer-events-none backdrop-blur-xs flex items-center gap-1.5">
          <i data-lucide="mouse-pointer" class="h-3 w-3 text-blue-600"></i>
          <span>Scroll mouse untuk Zoom • Geser kursor untuk Pan • Klik dua kali untuk reset</span>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="fixed bottom-5 left-1/2 z-[70] -translate-x-1/2 opacity-0 pointer-events-none" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
