<div class="flex-1 overflow-y-auto custom-scrollbar min-h-0 px-1">
  <section id="cards-container">

    <!-- TOMBOL TAMBAH DATA -->
    <div id="btn-add-card" class="add-card-item group">
      <div class="add-card-frame">
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-blue-600 transition-transform duration-200 group-hover:scale-110">
          <i data-lucide="plus" class="h-5 w-5"></i>
        </div>
      </div>
      <div class="card-meta-outside">
        <p class="truncate text-xs font-semibold text-blue-600">Tambah Data</p>
        <p class="text-[11px] font-medium text-blue-400">Input produk baru</p>
      </div>
    </div>

  </section>
</div>

<!-- MODAL FORM INPUT DATA BARU -->
<div id="modal-add-card" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200">
  <div id="modal-container" class="w-full max-w-sm scale-95 rounded-2xl bg-white p-5 shadow-2xl transition-all duration-200">

    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
      <div class="flex items-center gap-2">
        <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-blue-50 text-blue-600">
          <i data-lucide="plus" class="h-4 w-4"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-gray-900">Tambah Data Baru</h3>
          <p class="text-[11px] text-gray-400">Simpan ke IndexedDB lokal</p>
        </div>
      </div>
      <button id="btn-close-modal" type="button" class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition" title="Tutup">
        <i data-lucide="x" class="h-4 w-4"></i>
      </button>
    </div>

    <form id="form-add-card" class="mt-4 flex flex-col gap-3">
      <div>
        <label for="input-item-name" class="block text-xs font-semibold text-gray-700">Nama Barang</label>
        <input type="text" id="input-item-name" required placeholder="Contoh: Plat Akrilik 5mm" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2 text-xs text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
      </div>

      <div>
        <label for="input-item-qty" class="block text-xs font-semibold text-gray-700">Jumlah (Pcs)</label>
        <div class="relative mt-1 flex items-center">
          <input type="number" id="input-item-qty" required min="1" placeholder="Contoh: 250" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-xs font-bold text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 pr-12" />
          <span class="absolute right-3 text-xs font-bold text-blue-600">PCS</span>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Foto Barang (Drag & Drop)</label>

        <div id="dropzone" class="dropzone-area flex flex-col items-center justify-center rounded-xl p-3 text-center cursor-pointer bg-gray-50/60 hover:bg-gray-50">
          <div id="dropzone-prompt" class="flex flex-col items-center">
            <i data-lucide="upload-cloud" class="h-7 w-7 text-blue-500 mb-1"></i>
            <p class="text-xs font-medium text-gray-700">Tarik gambar ke sini, atau <span class="text-blue-600 underline">pilih file</span></p>
            <p class="text-[10px] text-gray-400 mt-0.5">Mendukung PNG, JPG, WebP (opsional)</p>
          </div>

          <div id="dropzone-preview" class="hidden flex-col items-center gap-1.5">
            <div class="h-20 w-16 rounded-md overflow-hidden border border-gray-200 bg-white">
              <img id="preview-img-tag" src="" alt="Preview" class="h-full w-full object-cover" />
            </div>
            <span id="preview-filename" class="text-[10px] text-gray-500 max-w-[180px] truncate">nama-file.jpg</span>
            <button type="button" id="btn-remove-file" class="text-[10px] text-red-500 hover:underline">Hapus foto</button>
          </div>

          <input type="file" id="file-input" accept="image/*" class="hidden" />
        </div>
      </div>

      <div class="rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-[11px] text-amber-800">
        Deadline otomatis diset hari ini pukul 16:00 WIB. Bisa diubah di halaman detail.
      </div>

      <div class="mt-1 flex items-center justify-end gap-2 border-t border-gray-100 pt-3">
        <button type="button" id="btn-cancel-modal" class="rounded-lg border border-gray-200 px-3.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 transition">
          Batal
        </button>
        <button type="submit" class="inline-flex items-center gap-1.5 rounded-lg bg-blue-600 px-3.5 py-1.5 text-xs font-medium text-white hover:bg-blue-700 transition">
          <i data-lucide="check" class="h-3.5 w-3.5"></i>
          <span>Simpan ke Database</span>
        </button>
      </div>
    </form>

  </div>
</div>
